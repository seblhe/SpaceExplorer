<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedural Space Universe (Vite + Three + TS)</title>
</head>

<body>
    <div id="app"></div>

    <!-- HUD INTERFACE -->
    <div id="game-ui">

        <!-- TOP LEFT: GALAXY INFO -->
        <div class="hud-panel top-left">
            <div class="panel-header">
                <span class="icon">🌌</span> SYSTEME DE NAVIGATION
            </div>
            <div class="panel-content">
                <div class="data-row"><span class="label">GALAXIE:</span> <span id="hud-galaxy-name" class="value">--</span></div>
                <div class="data-row"><span class="label">TYPE:</span> <span id="hud-galaxy-type" class="value">--</span></div>
                <div class="data-row"><span class="label">SYSTEMES:</span> <span id="hud-galaxy-systems" class="value">--</span></div>
                <div class="data-row"><span class="label">COORD:</span> <span id="hud-coords" class="value">0, 0, 0</span></div>
            </div>
        </div>

        <!-- BOTTOM LEFT: NEARBY SYSTEMS -->
        <div class="hud-panel bottom-left">
            <div class="panel-header">
                <span class="icon">📡</span> SCANNER DE PROXIMITÉ
            </div>
            <div class="panel-content" id="hud-nearby-list">
                <!-- List items will be injected here -->
                <div class="list-item">Scan en cours...</div>
            </div>
        </div>

        <!-- RIGHT: CONTEXTUAL INFO (System / Planet) -->
        <div class="hud-panel right-panel">
            <div class="panel-header">
                <span class="icon">🔭</span> ANALYSEUR
            </div>

            <!-- SYSTEM INFO SECTION -->
            <div id="hud-system-info" class="info-section">
                <div class="section-title">SYSTÈME SOLAIRE</div>
                <div class="data-row"><span class="label">NOM:</span> <span id="hud-system-name" class="value">--</span></div>
                <div class="data-row"><span class="label">ETOILE:</span> <span id="hud-system-star" class="value">--</span></div>
                <div class="data-row"><span class="label">PLANETES:</span> <span id="hud-system-planets" class="value">--</span></div>
            </div>

            <div class="separator"></div>

            <!-- PLANET INFO SECTION -->
            <div id="hud-planet-info" class="info-section hidden">
                <div class="section-title">CIBLE VERROUILLÉE</div>
                <div class="planet-visual" id="hud-planet-visual"></div>
                <div class="data-row large"><span id="hud-planet-name" class="value highlight">--</span></div>
                <div class="data-row"><span class="label">TYPE:</span> <span id="hud-planet-type" class="value">--</span></div>
                <div class="data-row"><span class="label">BIOME:</span> <span id="hud-planet-biome" class="value">--</span></div>
                <div class="data-row"><span class="label">TEMP:</span> <span id="hud-planet-temp" class="value">--</span></div>
                <div class="data-row"><span class="label">GRAVITÉ:</span> <span id="hud-planet-gravity" class="value">--</span></div>

                <div class="sub-section">RESSOURCES</div>
                <div class="resource-bar">
                    <span class="label">Métaux</span>
                    <div class="bar-container">
                        <div id="res-metal-bar" class="bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="resource-bar">
                    <span class="label">Gaz</span>
                    <div class="bar-container">
                        <div id="res-gas-bar" class="bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div id="hud-no-target" class="info-section">
                <div class="status-text">AUCUNE CIBLE</div>
            </div>
        </div>
    </div>

    <div id="seed-container">SEED: <span id="seed"></span></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
